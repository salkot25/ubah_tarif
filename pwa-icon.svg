<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Outline -->
  <path d="M256 72 L384 120 V256 C384 344 320 408 256 440 C192 408 128 344 128 256 V120 Z" 
        fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Electric Bolt Icon -->
  <path d="M280 128 L176 272 H264 L232 384 L336 240 H248 Z" 
        fill="url(#boltGrad)" filter="url(#glow)" stroke="#fef08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
